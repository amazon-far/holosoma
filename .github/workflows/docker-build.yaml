name: Docker Image Release

on:
  workflow_dispatch:
    inputs:
      tag_latest:
        description: Test the candidate images and promote them to latest
        required: true
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'false'
      no_cache:
        description: Rebuild every image layer without using BuildKit cache
        required: true
        type: boolean
        default: false
  schedule:
    # Refresh upstream OS and language dependencies every Sunday at 09:00 UTC.
    - cron: '0 9 * * 0'
  push:
    branches:
      - main
    paths:
      - '.dockerignore'
      - '.github/workflows/build-docker-images.yaml'
      - '.github/workflows/docker-build.yaml'
      - '.github/workflows/promote-docker-images.yaml'
      - '.github/workflows/pytest.yaml'
      - '.github/workflows/test-images.yaml'
      - 'conftest.py'
      - 'demo_scripts/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'scripts/**'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: docker-image-release
  cancel-in-progress: false

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}

jobs:
  find-tested-images:
    name: Find Tested PR Images
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    outputs:
      reuse: ${{ steps.find.outputs.reuse }}
      commit_sha: ${{ steps.find.outputs.commit_sha }}
      source_tree: ${{ steps.find.outputs.source_tree }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Find merged pull request head
        id: merged-pr
        if: github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const pulls = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
                per_page: 100,
              },
            );
            const merged = pulls
              .filter((pull) => pull.merged_at !== null)
              .sort((left, right) => left.merged_at.localeCompare(right.merged_at));
            return merged.at(-1)?.head.sha ?? '';
      - name: Find source-tree-matching image set
        id: find
        shell: bash
        env:
          MERGED_PR_HEAD: ${{ steps.merged-pr.outputs.result }}
        run: |
          set -euo pipefail
          reuse=false
          commit_sha=
          source_tree=
          write_outputs() {
            printf 'reuse=%s\ncommit_sha=%s\nsource_tree=%s\n' \
              "$reuse" "$commit_sha" "$source_tree" >> "$GITHUB_OUTPUT"
          }
          trap write_outputs EXIT

          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            exit 0
          fi

          source_tree=$(git rev-parse 'HEAD^{tree}')
          commit_sha=$MERGED_PR_HEAD
          if [[ -z "$commit_sha" ]]; then
            echo "No merged pull request is associated with ${GITHUB_SHA}; images will be rebuilt."
            exit 0
          fi

          if [[ ! "$commit_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not determine the merged pull request head; images will be rebuilt."
            exit 0
          fi

          images=(
            holosoma
            holosoma-inference
            holosoma-retargeting
            holosoma-isaacgym
            holosoma-isaacsim
            holosoma-mujoco
            holosoma-thor-inference
            holosoma-thor-inference-ros
          )
          for image in "${images[@]}"; do
            ref="${ECR_REGISTRY}/${image}:tested-sha-${commit_sha}"
            image_commit=$(docker buildx imagetools inspect \
              --format '{{ index .Image.Config.Labels "org.holosoma.commit" }}' \
              "$ref" 2>/dev/null) || image_commit=
            image_tree=$(docker buildx imagetools inspect \
              --format '{{ index .Image.Config.Labels "org.holosoma.source-tree" }}' \
              "$ref" 2>/dev/null) || image_tree=
            if [[ "$image_commit" != "$commit_sha" || "$image_tree" != "$source_tree" ]]; then
              echo "${ref} does not match commit ${commit_sha} and source tree ${source_tree}; images will be rebuilt."
              exit 0
            fi
          done

          reuse=true
          echo "Reusing tested PR images for \`${commit_sha}\` and source tree \`${source_tree}\`." >> "$GITHUB_STEP_SUMMARY"

  build-images:
    name: Build Candidate Images
    needs: find-tested-images
    if: github.event_name == 'workflow_dispatch' || needs.find-tested-images.outputs.reuse != 'true'
    uses: ./.github/workflows/build-docker-images.yaml
    with:
      image_sha: ${{ github.sha }}
      candidate_tag: candidate-${{ github.sha }}-${{ github.run_id }}
      no_cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
    secrets: inherit

  promote-tested-images:
    name: Promote Tested PR Images
    needs: find-tested-images
    if: github.event_name == 'push' && needs.find-tested-images.outputs.reuse == 'true'
    uses: ./.github/workflows/promote-docker-images.yaml
    with:
      commit_sha: ${{ needs.find-tested-images.outputs.commit_sha }}
      source_tag: tested-sha-${{ needs.find-tested-images.outputs.commit_sha }}
      expected_source_tree: ${{ needs.find-tested-images.outputs.source_tree }}
      tests_already_passed: true
    secrets: inherit

  test-and-promote-built-images:
    name: Test and Promote Built Images
    needs:
      - find-tested-images
      - build-images
    if: >-
      !cancelled() &&
      needs.build-images.result == 'success' &&
      needs.find-tested-images.outputs.reuse != 'true' &&
      (
        github.event_name == 'push' ||
        github.event_name == 'schedule' ||
        inputs.tag_latest == 'true'
      )
    uses: ./.github/workflows/promote-docker-images.yaml
    with:
      commit_sha: ${{ github.sha }}
      source_tag: candidate-${{ github.sha }}-${{ github.run_id }}
    secrets: inherit

  report-main-failure:
    name: Report Main Image Release Failure
    needs:
      - find-tested-images
      - build-images
      - promote-tested-images
      - test-and-promote-built-images
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'schedule') &&
      (
        needs.find-tested-images.result != 'success' ||
        (
          needs.find-tested-images.outputs.reuse == 'true' &&
          needs.promote-tested-images.result != 'success'
        ) ||
        (
          needs.find-tested-images.outputs.reuse != 'true' &&
          (
            needs.build-images.result != 'success' ||
            needs.test-and-promote-built-images.result != 'success'
          )
        )
      )
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUILD_RESULT: ${{ needs.build-images.result }}
          DISCOVERY_RESULT: ${{ needs.find-tested-images.result }}
          PROMOTE_BUILT_RESULT: ${{ needs.test-and-promote-built-images.result }}
          PROMOTE_TESTED_RESULT: ${{ needs.promote-tested-images.result }}
          REUSED_TESTED_IMAGES: ${{ needs.find-tested-images.outputs.reuse }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const title = `Docker image release failed for ${context.sha}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(
              (issue) => issue.pull_request === undefined && issue.title === title,
            );
            if (existing !== undefined) {
              await core.summary.addLink('Existing issue', existing.html_url).write();
              return;
            }

            let assignee = context.actor;
            try {
              const pulls = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner,
                  repo,
                  commit_sha: context.sha,
                  per_page: 100,
                },
              );
              const merged = pulls
                .filter((pull) => pull.merged_at !== null)
                .sort((left, right) => left.merged_at.localeCompare(right.merged_at));
              const mergedPull = merged.at(-1);
              if (mergedPull !== undefined) {
                const pull = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: mergedPull.number,
                });
                assignee = pull.data.merged_by?.login ?? assignee;
              }
            } catch (error) {
              core.warning(`Could not determine the merger; assigning ${assignee}: ${error.message}`);
            }
            const body = [
              'The automatic Docker image release for main did not complete.',
              '',
              `- Commit: \`${context.sha}\``,
              `- Merger: \`${assignee}\``,
              `- Tested PR images reused: \`${process.env.REUSED_TESTED_IMAGES || 'false'}\``,
              `- Discovery result: \`${process.env.DISCOVERY_RESULT}\``,
              `- Build result: \`${process.env.BUILD_RESULT}\``,
              `- Tested-image promotion result: \`${process.env.PROMOTE_TESTED_RESULT}\``,
              `- Built-image test and promotion result: \`${process.env.PROMOTE_BUILT_RESULT}\``,
              `- Workflow run: ${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${context.runId}`,
              '',
              'The candidate images were not promoted to `:latest`.',
            ].join('\n');
            const created = await github.rest.issues.create({ owner, repo, title, body });
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: created.data.number,
                assignees: [assignee],
              });
            } catch (error) {
              core.warning(`Created the issue, but could not assign ${assignee}: ${error.message}`);
            }
            await core.summary.addLink('Created issue', created.data.html_url).write();
