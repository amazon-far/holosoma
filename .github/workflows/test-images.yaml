name: Test Docker Images

on:
  workflow_call:
    inputs:
      combined_image:
        required: true
        type: string
      isaaclab2_image:
        required: true
        type: string
      isaaclab3_image:
        required: true
        type: string
      mujoco_image:
        required: true
        type: string
      run_mypy:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  isaaclab2:
    name: Isaac Sim
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: isaaclab2
      image: ${{ inputs.isaaclab2_image }}
      multigpu: '["False", "True"]'
    secrets: inherit

  isaaclab3:
    name: Isaac Sim 6.2 / Isaac Lab 3
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: isaaclab3
      image: ${{ inputs.isaaclab3_image }}
      multigpu: '["False", "True"]'
    secrets: inherit

  mujoco:
    name: MuJoCo
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: mujoco
      image: ${{ inputs.mujoco_image }}
    secrets: inherit

  combined:
    name: Combined
    uses: ./.github/workflows/test-combined-image.yaml
    with:
      image: ${{ inputs.combined_image }}
      run_mypy: ${{ inputs.run_mypy }}
    secrets: inherit
