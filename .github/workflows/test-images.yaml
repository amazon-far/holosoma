name: Test Docker Images

on:
  workflow_call:
    inputs:
      combined_image:
        required: true
        type: string
      isaacsim_image:
        required: true
        type: string
      isaacsim6_image:
        required: true
        type: string
      mujoco_image:
        required: true
        type: string
      run_mypy:
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  isaacsim:
    name: Isaac Sim
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: isaacsim
      image: ${{ inputs.isaacsim_image }}
      multigpu: '["False", "True"]'
    secrets: inherit

  isaacsim6:
    name: Isaac Sim 6.2 / Isaac Lab 3
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: isaacsim
      isaacsim_backend: isaacsim6
      image: ${{ inputs.isaacsim6_image }}
      multigpu: '["False", "True"]'
    secrets: inherit

  mujoco:
    name: MuJoCo
    uses: ./.github/workflows/test-simulator-image.yaml
    with:
      simulator: mujoco
      image: ${{ inputs.mujoco_image }}
    secrets: inherit

  combined:
    name: Combined
    uses: ./.github/workflows/test-combined-image.yaml
    with:
      image: ${{ inputs.combined_image }}
      run_mypy: ${{ inputs.run_mypy }}
    secrets: inherit
