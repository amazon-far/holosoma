name: Build Python distribution (reusable)

# Reusable distribution build. Pure-Python packages get a universal wheel;
# native packages get tested manylinux wheels for x86_64 and aarch64 (Jetson/Thor),
# each built on a runner of that architecture, plus an sdist for source builds.
# Uploads the `dist` artifact for the caller's publishing job.
#
# This is called by the per-package publish-*.yml workflows. The actual PyPI
# upload (OIDC Trusted Publishing) lives in those callers, not here, so each
# PyPI project's Trusted Publisher can match its own caller workflow filename.
#
# NOTE: we build with `uv build` (uv is preinstalled on these runners, as the
# docker workflows already rely on) rather than actions/setup-python + `python -m
# build`. setup-python bootstraps a toolcache Python that isn't present on these
# self-hosted AWS CodeBuild runners (same reason the SDK release.yml avoids it),
# and uv provisions its own interpreter. Any host interpreter builds these
# pure-Python purelib wheels fine. The downstream publish job uploads with
# `uv publish` (OIDC trusted publishing) — no twine anywhere in the pipeline.

on:
  workflow_call:
    inputs:
      package-dir:
        description: Path to the package directory (holds pyproject.toml/setup.py).
        required: true
        type: string
      native:
        description: Build interpreter-specific Linux wheels in a manylinux container.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist + wheel
        if: ${{ !inputs.native }}
        working-directory: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          echo "Building ${{ inputs.package-dir }} with uv $(uv --version)"
          uv build --out-dir dist

      - name: Build native source distribution
        if: ${{ inputs.native }}
        working-directory: ${{ inputs.package-dir }}
        run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.native && 'dist-sdist' || 'dist' }}
          path: ${{ inputs.package-dir }}/dist/*
          if-no-files-found: error

  native-wheels:
    name: Build and test ${{ matrix.arch }} wheels
    if: ${{ inputs.native }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner_prefix: codebuild-holosoma-cpu-build
          - arch: aarch64
            runner_prefix: codebuild-holosoma-arm-build
    runs-on: ${{ matrix.runner_prefix }}-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test portable native wheels
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          CIBW_ARCHS: ${{ matrix.arch }}
          # cibuildwheel also drops interpreters outside the package's requires-python.
          CIBW_BUILD: 'cp310-manylinux_* cp311-manylinux_* cp312-manylinux_* cp313-manylinux_*'
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: 'build[uv]'
          CIBW_TEST_COMMAND: >-
            python -c "import numpy as np; import holosoma_inference as h;
            p = h.get_policy_from_preset('g1-29dof-loco');
            assert p.step(np.zeros((1,100))).shape == (1,29)"
        run: |
          set -euo pipefail
          cibw() { uvx --with bashlex==0.18 --from cibuildwheel==2.23.3 cibuildwheel "$@"; }
          # Expect exactly the wheels cibuildwheel itself selects for this runner.
          expected=$(cibw --print-build-identifiers "$PACKAGE_DIR" | grep -c "_${CIBW_ARCHS}\$" || true)
          echo "expecting ${expected} ${CIBW_ARCHS} wheels"
          [ "$expected" -gt 0 ]
          cibw "$PACKAGE_DIR" --output-dir "$PACKAGE_DIR/dist"
          built=$(find "$PACKAGE_DIR/dist" -name "*manylinux*_${CIBW_ARCHS}.whl" | wc -l)
          echo "built ${built} ${CIBW_ARCHS} wheels"
          [ "$built" -eq "$expected" ]

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.arch }}
          path: ${{ inputs.package-dir }}/dist/*.whl
          if-no-files-found: error

  collect:
    name: Collect native distribution
    if: ${{ inputs.native }}
    needs: [build, native-wheels]
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
