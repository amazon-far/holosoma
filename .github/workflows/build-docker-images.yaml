name: Build Docker Image Matrix

on:
  workflow_call:
    inputs:
      image_sha:
        description: Full commit SHA recorded in image metadata
        required: true
        type: string
      candidate_tag:
        description: Workflow-run tag used until the image set passes its tests
        required: true
        type: string
      no_cache:
        description: Rebuild every image layer without using BuildKit cache
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  IMAGE_SHA: ${{ inputs.image_sha }}
  CANDIDATE_TAG: ${{ inputs.candidate_tag }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: inference
            image: holosoma-inference
            dockerfile: src/holosoma_inference/docker/Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-cpu-build
          - environment: retargeting
            image: holosoma-retargeting
            dockerfile: src/holosoma_retargeting/docker/Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-cpu-build
          - environment: holosoma
            image: holosoma
            dockerfile: docker/Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-a10g-x1-gpu-build
          - environment: isaacgym
            image: holosoma-isaacgym
            dockerfile: docker/isaacgym.Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-a10g-x1-gpu-build
          - environment: isaacsim
            image: holosoma-isaacsim
            dockerfile: docker/isaacsim.Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-a10g-x1-gpu-build
          - environment: mujoco
            image: holosoma-mujoco
            dockerfile: docker/mujoco.Dockerfile
            dependency_target: dependencies
            target: runtime
            runner_prefix: codebuild-holosoma-cpu-build
            build_args: WARP=true
          - environment: thor-inference
            image: holosoma-thor-inference
            dockerfile: docker/thor/Dockerfile
            dependency_target: app-deps
            target: inference
            runner_prefix: codebuild-holosoma-arm-build
          - environment: thor-inference-ros
            image: holosoma-thor-inference-ros
            dockerfile: docker/thor/Dockerfile
            dependency_target: app-deps-ros
            target: inference-ros
            runner_prefix: codebuild-holosoma-arm-build
    name: Build ${{ matrix.environment }} Docker Image
    runs-on: ${{ matrix.runner_prefix }}-${{ github.run_id }}-${{ github.run_attempt }} buildspec-override:true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate image metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "image_sha must be a full 40-character lowercase Git SHA" >&2
            exit 1
          }
          expected_candidate="candidate-${IMAGE_SHA}-${GITHUB_RUN_ID}"
          [[ "$CANDIDATE_TAG" == "$expected_candidate" ]] || {
            echo "candidate_tag must be ${expected_candidate}" >&2
            exit 1
          }
          source_tree=$(git rev-parse 'HEAD^{tree}')
          [[ "$source_tree" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Could not determine the checked-out source tree" >&2
            exit 1
          }
          echo "tree=$source_tree" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate image tags
        id: tags
        shell: bash
        run: |
          image_path="${ECR_REGISTRY}/${{ matrix.image }}"
          echo "dependency=${image_path}:dependencies-${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "runtime=${image_path}:${CANDIDATE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push dependency image
        id: dependency_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.dependency_target }}
          pull: true
          push: true
          no-cache: ${{ inputs.no_cache }}
          build-args: |
            ${{ matrix.build_args }}
          tags: ${{ steps.tags.outputs.dependency }}
          cache-from: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.ECR_REGISTRY }}/${{ matrix.image }}:buildcache,mode=max

      - name: Build and push source image
        id: runtime_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          pull: true
          push: true
          no-cache: ${{ inputs.no_cache }}
          build-contexts: |
            ${{ matrix.dependency_target }}=docker-image://${{ steps.tags.outputs.dependency }}
          build-args: |
            HOLOSOMA_COMMIT=${{ inputs.image_sha }}
            HOLOSOMA_SOURCE_TREE=${{ steps.source.outputs.tree }}
            ${{ matrix.build_args }}
          tags: ${{ steps.tags.outputs.runtime }}

      - name: Summary
        run: |
          {
            echo "- Built \`${{ matrix.environment }}\` dependencies as \`dependencies-${CANDIDATE_TAG}\`."
            echo "- Built source image as \`${CANDIDATE_TAG}\` from tree \`${{ steps.source.outputs.tree }}\`."
            echo "- Candidate digest: \`${{ steps.runtime_image.outputs.digest }}\`."
            echo "- BuildKit cache disabled: \`${{ inputs.no_cache }}\`."
          } >> "$GITHUB_STEP_SUMMARY"
