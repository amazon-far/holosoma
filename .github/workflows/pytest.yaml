name: Pytests

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/source_*'
    types:
    - opened
    - reopened
    - synchronize

jobs:
  tests:
    strategy:
      fail-fast: false # continue on one test failing
      matrix:
        simulator: [isaacgym, isaacsim, mujoco]
        multigpu: ["False"]
        # no multigpu isaacsim/mujoco tests for now
        include:
        - simulator: isaacgym
          multigpu: "True"
    name: Run ${{ matrix.simulator }} Tests with ${{ matrix.multigpu == 'True' && 'multi-gpu' || 'single-gpu' }}
    runs-on:
    - codebuild-holosoma-a10g-${{ matrix.multigpu == 'True' && 'x4' || 'x1' }}-gpu-build-${{ github.run_id }}-${{ github.run_attempt }}
    continue-on-error: true
    container:
      image: ${{ vars.ECR_REGISTRY }}/holosoma-${{ matrix.simulator }}:latest
      options: "--gpus all --runtime=nvidia --shm-size=12g"
      env:
        HOLOSOMA_MULTIGPU: ${{ matrix.multigpu }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pytest
        id: pytest
        shell: bash
        run: |
          ln -s /root/.holosoma_deps "$HOME/.holosoma_deps"
          if [[ ! -L /workspace/holosoma ]]; then
            rm -rf /workspace/holosoma
            ln -sfF "$GITHUB_WORKSPACE" /workspace/holosoma
          fi
          bash tests/ci/${{ matrix.simulator }}_ci_tests.sh

  e2e-tests:
    strategy:
      fail-fast: false # continue on one test failing
      # e2e only on isaacgym single gpu for now
      matrix:
        simulator: [isaacgym]
        multigpu: ["False"]
    name: Run ${{ matrix.simulator }} Tests end-to-end with ${{ matrix.multigpu == 'True' && 'multi-gpu' || 'single-gpu' }}
    runs-on:
    - codebuild-holosoma-a10g-${{ matrix.multigpu == 'True' && 'x4' || 'x1' }}-gpu-build-${{ github.run_id }}-${{ github.run_attempt }}
    continue-on-error: true
    container:
      # needs both hsgym and hsinference envs
      image: ${{ vars.ECR_REGISTRY }}/holosoma:latest
      options: "--gpus all --runtime=nvidia --shm-size=12g"
      env:
        HOLOSOMA_MULTIGPU: ${{ matrix.multigpu }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pytest
        id: pytest
        shell: bash
        run: |
          ln -s /root/.holosoma_deps "$HOME/.holosoma_deps"
          if [[ ! -L /workspace/holosoma ]]; then
            rm -rf /workspace/holosoma
            ln -sfF "$GITHUB_WORKSPACE" /workspace/holosoma
          fi
          bash tests/ci/${{ matrix.simulator }}_e2e_ci_tests.sh

  inference-tests:
    name: Run Inference Unit Tests
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      # TODO: Switch to `holosoma-inference` once it's been confirmed functional
      # image: ${{ vars.ECR_REGISTRY }}/holosoma-inference:latest
      # Until then, the inference tests will run in isaacsim env.
      image: ${{ vars.ECR_REGISTRY }}/holosoma:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Tests
        shell: bash
        run: |
          ln -s /root/.holosoma_deps "$HOME/.holosoma_deps"
          if [[ ! -L /workspace/holosoma ]]; then
            rm -rf /workspace/holosoma
            ln -sfF "$GITHUB_WORKSPACE" /workspace/holosoma
          fi
          source scripts/source_isaacsim_setup.sh
          pip install -e src/holosoma_inference
          pytest -s src/holosoma_inference/

  service-integration-tests:
    # The service's contract is its ROS2 topic API, so these run in a real ROS2
    # Jazzy workspace (the inference-tests env above has no rclpy/colcon and
    # would only skip them). Builds the minimal test image and runs it.
    name: Run Service Integration Tests (ROS2)
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build service test image
        run: |
          docker build \
            -f src/holosoma_inference/holosoma_inference_service/docker/Dockerfile.test \
            -t holosoma-service-test .
      - name: Run service integration tests
        run: docker run --rm holosoma-service-test

  no-sim-tests:
    name: Run No-Simulator Tests
    runs-on: codebuild-holosoma-cpu-build-${{ github.run_id }}-${{ github.run_attempt }}
    container:
      # Pure tests, no GPU/sim libs needed; runs in the isaacsim env on a CPU runner.
      image: ${{ vars.ECR_REGISTRY }}/holosoma:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pytest
        id: pytest
        shell: bash
        run: |
          ln -s /root/.holosoma_deps "$HOME/.holosoma_deps"
          if [[ ! -L /workspace/holosoma ]]; then
            rm -rf /workspace/holosoma
            ln -sfF "$GITHUB_WORKSPACE" /workspace/holosoma
          fi
          bash tests/ci/no_sim_ci_tests.sh
