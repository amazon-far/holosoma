[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[project]
name = "holosoma-retargeting"
version = "0.1.0"
description = "Retargeting utilities for converting human motions to robot motions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amazon FAR Team" }]
license = { text = "Apache-2.0" }
keywords = ["humanoid", "robotics", "retargeting", "motion", "smpl", "mocap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Needs to ping numpy to 2.3.5;
    # reason: later numpy version such as 2.4 will trigger
    # "TypeError: only 0-dimensional arrays can be converted to Python scalars"
    # in yourdf/urdf.py::1078 when converting float(q)
    "numpy==2.3.5",
    "torch",
    "tqdm",
    "scipy",
    "matplotlib",
    "trimesh",
    "smplx",
    "jinja2",
    "mujoco",
    "viser",
    "imageio[ffmpeg]",
    "robot_descriptions",
    "yourdfpy",
    "cvxpy",
    "libigl",
    "tyro",
    "h5py",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]
usd = ["usd-core"]

# uv_build packaging. FLAT layout (the holosoma_retargeting/ module lives at the
# project root, not under src/), so module-root = "". README.md now sits at the
# project root (moved up from holosoma_retargeting/README.md) so the readme
# reference resolves and the long description is packaged.
[tool.uv.build-backend]
module-name = "holosoma_retargeting"
module-root = ""
# The module directory can contain large, locally generated datasets and
# recordings that are intentionally gitignored. uv_build includes the whole
# module directory by default, so exclude those paths explicitly from sdists
# and wheels while retaining the tracked sample data under demo_data.
source-exclude = [
    "/holosoma_retargeting/data/**",
    "/holosoma_retargeting/demo_data/lafan/**",
    "/holosoma_retargeting/demo_data/xsens_tennis/**",
    "/holosoma_retargeting/demo_results/**",
    "/holosoma_retargeting/demo_results_parallel/**",
    "/holosoma_retargeting/converted_res/**",
    "/holosoma_retargeting/data_utils/lafan1/**",
    "/holosoma_retargeting/experiments/**",
    "/holosoma_retargeting/nightly_data/**",
    "/holosoma_retargeting/nightly_results/**",
    "/holosoma_retargeting/results_single/**",
    "/holosoma_retargeting/rt_all_data/**",
    "/holosoma_retargeting/rt_results/**",
    "/holosoma_retargeting/src/holosoma_retargeting/**",
    "/holosoma_retargeting/videos/**",
]
# Ship the bundled robot descriptions, meshes, motion data, and templates that
# live inside the module (the old setuptools build shipped none of these — it
# had no MANIFEST.in or package_data). Covers robot descriptions + meshes
# (urdf/xml/STL/obj/dae/mtl), motion/weight data (npy/pt/pkl), the urdf jinja
# template, and the in-module how-to docs.
source-include = [
    "holosoma_retargeting/**/*.STL",
    "holosoma_retargeting/**/*.obj",
    "holosoma_retargeting/**/*.dae",
    "holosoma_retargeting/**/*.mtl",
    "holosoma_retargeting/**/*.xml",
    "holosoma_retargeting/**/*.urdf",
    "holosoma_retargeting/**/*.jinja",
    "holosoma_retargeting/**/*.npy",
    "holosoma_retargeting/**/*.pt",
    "holosoma_retargeting/**/*.pkl",
    "holosoma_retargeting/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
