[build-system]
requires = ["uv_build>=0.9.9,<0.10"]
build-backend = "uv_build"

[project]
name = "holosoma-retargeting"
version = "0.1.0"
description = "Retargeting utilities for converting human motions to robot motions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amazon FAR Team" }]
license = { text = "Apache-2.0" }
keywords = ["humanoid", "robotics", "retargeting", "motion", "smpl", "mocap"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    # Pinned to numpy 2.3.5; numpy 2.4+ triggers
    # "TypeError: only 0-dimensional arrays can be converted to Python scalars"
    # in yourdf/urdf.py::1078 when converting float(q).
    #
    # NOTE: this is deliberately incompatible with `holosoma`, which requires
    # numpy<2. The two packages cannot share one environment -- install them into
    # separate environments, as the demo scripts do by switching conda envs.
    "numpy==2.3.5",
    "torch",
    "tqdm",
    "scipy",
    "matplotlib",
    "trimesh",
    # NOTE: `smplx` and `human_body_prior` are intentionally NOT declared here.
    # smplx carries the Max Planck research license (non-commercial, and
    # explicitly No Distribution); human_body_prior is AGPL-3.0/GPLv3. Neither can
    # be a dependency of an Apache-2.0 package published to PyPI. Both are now
    # imported lazily, inside the one function that needs each, so this package
    # installs and imports without them -- see src/utils.py::load_smpl_motion and
    # data_utils/prep_amass_smplx_for_rt.py. Users who need those AMASS/SMPL-X
    # data-prep paths install both themselves, under the upstream terms.
    "jinja2",
    "mujoco",
    "viser",
    "robot_descriptions",
    "yourdfpy",
    "cvxpy",
    "libigl",
    "tyro",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

# uv_build packaging. FLAT layout (the holosoma_retargeting/ module lives at the
# project root, not under src/), so module-root = "". README.md now sits at the
# project root (moved up from holosoma_retargeting/README.md) so the readme
# reference resolves and the long description is packaged.
[tool.uv.build-backend]
module-name = "holosoma_retargeting"
module-root = ""
# Ship the bundled robot descriptions, meshes, motion data, and templates that
# live inside the module (the old setuptools build shipped none of these — it
# had no MANIFEST.in or package_data). Covers robot descriptions + meshes
# (urdf/xml/STL/obj/dae/mtl), motion/weight data (npy/pt/pkl), the urdf jinja
# template, and the in-module how-to docs.
source-include = [
    "holosoma_retargeting/**/*.STL",
    "holosoma_retargeting/**/*.obj",
    "holosoma_retargeting/**/*.dae",
    "holosoma_retargeting/**/*.mtl",
    "holosoma_retargeting/**/*.xml",
    "holosoma_retargeting/**/*.urdf",
    "holosoma_retargeting/**/*.jinja",
    "holosoma_retargeting/**/*.npy",
    "holosoma_retargeting/**/*.pt",
    "holosoma_retargeting/**/*.pkl",
    "holosoma_retargeting/**/*.md",
]
