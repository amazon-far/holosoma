# G1 with a pelvis LiDAR on MuJoCo, headless.
#
#   python -m holosoma.run_sim --config @holosoma/examples/configs/g1_lidar.yaml
#
# Command-line tokens after --config take precedence, e.g.
#   ... --config @holosoma/examples/configs/g1_lidar.yaml terrain:terrain-locomotion-mix --training.seed 7
# See docs/config-files.md for the format.
version: 1
arguments:
  # Group selections: <group>:<preset>
  simulator: mujoco
  robot: g1-29dof
  # Keyed selections: <family>.<key>:<preset>
  sensor:
    scan: g1-pelvis-lidar
  # Field overrides: --<dotted.path>=<value>; nested mappings expand to one flag per leaf.
  overrides:
    training.headless: true
    robot.init_state.pos: [0.0, 0.0, 0.8]
    sensor.scan:
      update_decimation: 10Hz
