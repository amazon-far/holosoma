# G1 with a pelvis LiDAR on MuJoCo, headless. No task: simulation is the default.
#
#   holosoma --config @holosoma/examples/configs/g1_lidar.yaml
#
# Command-line tokens after --config take precedence, e.g.
#   ... --config @holosoma/examples/configs/g1_lidar.yaml terrain:terrain-locomotion-mix --run.seed 7
# See docs/config-files.md for the format.
version: 1
arguments:
  # Selections, by path: <path>:<preset>
  simulator: mujoco-sim2sim
  robot: g1-29dof
  # Named slots: <path>.<key>:<preset>
  sensor:
    scan: g1-pelvis-lidar
  # Field values: --<dotted.path>=<value>; nested mappings expand to one flag per leaf.
  overrides:
    run.headless: true
    robot.init_state.pos: [0.0, 0.0, 0.8]
    sensor.scan:
      update_decimation: 10Hz
