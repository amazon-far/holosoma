# G1 velocity tracking with PPO on Isaac Sim.
#
#   python -m holosoma.train_agent --config @holosoma/examples/configs/g1_locomotion_train.yaml
#
# Command-line tokens after --config take precedence, e.g. another backend or a smaller run:
#   ... --config @holosoma/examples/configs/g1_locomotion_train.yaml simulator:mjwarp --training.num_envs 1024
# See docs/config-files.md for the format.
version: 1
arguments:
  # The experiment preset; passed first whatever its position here.
  exp: g1-29dof
  simulator: isaacsim
  overrides:
    training.seed: 1
    training.headless: true
