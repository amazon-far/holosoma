[mypy]
python_version = 3.8
exclude = (?x)(
    src/.*/setup.py$
    | src/holosoma_inference/.*
    | src/holosoma/build/.*
    )
files = src
plugins = pydantic.mypy

warn_redundant_casts = True

[mypy-holosoma.*]
disallow_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
disallow_any_generics = True
warn_unused_ignores = True
check_untyped_defs = True
warn_unreachable = True
strict_equality = True
warn_return_any = True
enable_error_code = truthy-bool, possibly-undefined, redundant-expr

[mypy-holosoma.utils.torch_utils]
no_implicit_optional = True
warn_unused_ignores = True
disallow_untyped_defs = True
disallow_any_generics = True

# The arity-guard tests carry ``type: ignore[call-overload]`` on registrations that HookRegistry.add's
# typed overloads must reject. warn_unused_ignores makes those ignores load-bearing: if the overloads
# regress and stop flagging the mismatch, the now-unused ignore fails mypy in CI.
[mypy-holosoma.simulator.base_simulator.tests.test_hooks]
warn_unused_ignores = True

# Please keep them alphabetically sorted

[mypy-booster_robotics_sdk.*]
ignore_missing_imports = True
# Opaque C++ bindings: mypy can now resolve the installed module but can't
# introspect its attributes (would raise attr-defined on every imported name).
follow_imports = skip

