[mypy-viser.*]
ignore_missing_imports = True

# warp's public surface churns per release and the repo must type-check against several at once:
# mujoco-warp pins 1.15.0 (scripts/versions.sh) while the Isaac Sim 5.1 runtime contract pins
# 1.16.0 (scripts/isaacsim_constraints.txt), so no single version can be assumed. Skipping imports
# matches what the pre-commit mypy hook already does (--ignore-missing-imports), keeping the two
# static gates in agreement.
[mypy-warp.*]
ignore_missing_imports = True
follow_imports = skip

[mypy-wandb_workspaces.*]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True
